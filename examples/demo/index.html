    <style>
      html, body, #root { height: 100%; margin: 0; }

      /* Scrollbars as in the Fimainfo extranet (the builder has the same):
         thin, no arrows, shown while the pointer is over the scrolling block.
         Chromium >= 121 drops ::-webkit-scrollbar once scrollbar-width or
         scrollbar-color is set, so those two are for Firefox only. */
      :root { --scrollbar-thumb: rgb(156 163 175 / 0.45); --scrollbar-thumb-hover: rgb(107 114 128 / 0.7); }
      @supports not selector(::-webkit-scrollbar) {
        * { scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) transparent; }
      }
      ::-webkit-scrollbar { width: 5.6px; height: 5.6px; background: transparent; }
      ::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
      ::-webkit-scrollbar-track, ::-webkit-scrollbar-track-piece, ::-webkit-scrollbar-corner { background: transparent; border: 0; box-shadow: none; }
      ::-webkit-scrollbar-thumb {
        background-color: var(--scrollbar-thumb); border: 1.4px solid transparent; background-clip: content-box;
        border-radius: 9999px; min-height: 2rem; min-width: 2rem; transition: background-color 150ms ease;
      }
      ::-webkit-scrollbar-thumb:hover { background-color: var(--scrollbar-thumb-hover); }
      @media (hover: hover) and (pointer: fine) {
        @supports not selector(::-webkit-scrollbar) {
          * { scrollbar-color: transparent transparent; }
          *:hover, *:focus-visible { scrollbar-color: var(--scrollbar-thumb) transparent; }
        }
        ::-webkit-scrollbar-thumb { background-color: transparent; }
        *:hover::-webkit-scrollbar-thumb, *:focus-visible::-webkit-scrollbar-thumb { background-color: var(--scrollbar-thumb); }
        *:hover::-webkit-scrollbar-thumb:hover, *:focus-visible::-webkit-scrollbar-thumb:hover { background-color: var(--scrollbar-thumb-hover); }
      }
      body {
        --display: 'Bricolage Grotesque', 'Geist', ui-sans-serif, system-ui, sans-serif;
        --sans: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        /* the builder and the template bank use the same faces as the page */
        --eb-font-sans: var(--sans);
        --eb-font-mono: 'Geist Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
        font-family: var(--sans);
        text-rendering: optimizeLegibility;
        background: #f6f7fb;
        color: #1f2433;
        -webkit-font-smoothing: antialiased;
      }

      /* Landing page only: the builder brings its own styles. Colours follow
         the builder (indigo primary, cool greys) so opening a template does
         not feel like changing sites. */
      .landing {
        --primary: oklch(0.55 0.2 277);
        --primary-hover: oklch(0.5 0.2 277);
        --primary-soft: oklch(0.95 0.03 277);
        --ink: #1f2433;
        --ink-2: #3d4354;
        --muted: #6b7183;
        --line: #e3e6ec;
        --surface: #ffffff;
        --mono: 'Geist Mono', 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
        /* pointer position, eased in JS (usePointerGlow) */
        --mx: 50%;
        --my: 15%;
        position: relative;
        isolation: isolate;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        overflow-x: clip;
      }
      .landing *, .landing *::before, .landing *::after { box-sizing: border-box; }
      .landing :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
      .wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 16px; }
      .wrap-wide { max-width: 1608px; padding: 0 24px; }

      /* ── background ──────────────────────────────────────────────────────
         Three layers, all quiet: a slow aurora that shifts by itself, a light
         that trails the pointer, and a dot grid that is only visible around
         it. Fixed, so it stays put while the page scrolls. */
      .backdrop { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; background: #f6f7fb; }
      .backdrop::before {
        content: ''; position: absolute; inset: -20%;
        background:
          radial-gradient(40% 35% at 20% 10%, oklch(0.88 0.08 277 / 0.55), transparent 70%),
          radial-gradient(35% 30% at 85% 5%, oklch(0.9 0.07 230 / 0.5), transparent 70%),
          radial-gradient(30% 30% at 60% 40%, oklch(0.93 0.05 320 / 0.35), transparent 70%);
        filter: blur(20px);
        animation: aurora 26s ease-in-out infinite alternate;
      }
      .backdrop::after {
        content: ''; position: absolute; inset: 0;
        background:
          radial-gradient(520px circle at var(--mx) var(--my), oklch(0.7 0.18 277 / 0.13), transparent 65%),
          radial-gradient(circle, oklch(0.45 0.12 277 / 0.32) 1px, transparent 1.4px) 0 0 / 22px 22px;
        -webkit-mask-image: radial-gradient(420px circle at var(--mx) var(--my), #000 0%, rgb(0 0 0 / 0.18) 60%, rgb(0 0 0 / 0.06) 100%);
        mask-image: radial-gradient(420px circle at var(--mx) var(--my), #000 0%, rgb(0 0 0 / 0.18) 60%, rgb(0 0 0 / 0.06) 100%);
      }
      @keyframes aurora {
        0% { transform: translate3d(0, 0, 0) rotate(0deg); filter: blur(20px) hue-rotate(0deg); }
        50% { transform: translate3d(3%, 2%, 0) rotate(4deg); filter: blur(24px) hue-rotate(-14deg); }
        100% { transform: translate3d(-3%, 1%, 0) rotate(-3deg); filter: blur(20px) hue-rotate(12deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .backdrop::before { animation: none; }
      }

      /* top bar */
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 20px; }
      .brand { display: inline-flex; align-items: center; gap: 11px; font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--ink); letter-spacing: -0.02em; }
      .brand-mark { display: block; filter: drop-shadow(0 5px 10px oklch(0.5 0.2 277 / 0.35)); transition: transform 0.2s; }
      .brand-mark svg { width: 44px; height: 33px; display: block; }
      .brand:hover .brand-mark { transform: translateY(-1px) rotate(-3deg); }
      .topbar-actions { display: flex; align-items: center; gap: 8px; }
      .segmented {
        display: inline-flex; padding: 3px; border-radius: 999px; border: 1px solid var(--line);
        background: rgb(255 255 255 / 0.7); backdrop-filter: blur(8px);
      }
      .segmented button {
        font: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; border: 0; cursor: pointer;
        padding: 4px 11px; border-radius: 999px; background: transparent; color: var(--muted);
        transition: background 0.15s, color 0.15s;
      }
      .segmented button:hover { color: var(--ink); }
      .segmented button[aria-pressed='true'] { background: var(--primary); color: #fff; cursor: default; }

      .btn {
        font: inherit; font-size: 13px; font-weight: 500; line-height: 1; display: inline-flex; align-items: center; gap: 7px;
        padding: 9px 14px; border-radius: 9px; cursor: pointer; text-decoration: none; white-space: nowrap;
        border: 1px solid var(--line); background: rgb(255 255 255 / 0.75); backdrop-filter: blur(8px); color: var(--ink);
        transition: background 0.15s, border-color 0.15s, transform 0.15s;
      }
      .btn svg { width: 15px; height: 15px; flex-shrink: 0; }
      .btn:hover { border-color: #cdd2db; background: #fff; transform: translateY(-1px); }

      /* hero */
      .hero { padding-top: 72px; padding-bottom: 44px; text-align: center; }
      .eyebrow {
        display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px;
        background: rgb(255 255 255 / 0.7); border: 1px solid var(--line); backdrop-filter: blur(8px);
        font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2);
      }
      .eyebrow i { width: 6px; height: 6px; border-radius: 50%; background: #22a06b; box-shadow: 0 0 0 3px rgb(34 160 107 / 0.18); animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 50% { box-shadow: 0 0 0 5px rgb(34 160 107 / 0.06); } }
      .hero h1 {
        margin: 20px 0 0; font-family: var(--display); font-size: clamp(38px, 6.8vw, 68px); line-height: 1.02; letter-spacing: -0.022em; font-weight: 700;
        color: var(--ink);
      }
      .hero h1 span {
        background: linear-gradient(110deg, oklch(0.55 0.21 280), oklch(0.6 0.17 240), oklch(0.58 0.2 300), oklch(0.55 0.21 280));
        background-size: 250% 100%;
        -webkit-background-clip: text; background-clip: text; color: transparent;
        animation: sheen 9s ease-in-out infinite alternate;
      }
      @keyframes sheen { to { background-position: 100% 0; } }
      .tagline { margin: 18px auto 0; max-width: 620px; text-wrap: balance; font-size: 17px; line-height: 1.55; color: var(--ink-2); }
      .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 22px; }
      .chip {
        display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px;
        background: rgb(255 255 255 / 0.75); backdrop-filter: blur(8px); border: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2);
      }
      .chip svg { width: 14px; height: 14px; color: var(--primary); }

      /* developer strip: install command + the two lines of code */
      .dev { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 30px; }
      .install {
        display: inline-flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; border-radius: 10px; max-width: 100%;
        background: #161a28; color: #e6e8ef; font-family: var(--mono); font-size: 13px;
        box-shadow: 0 10px 24px -14px rgb(22 26 40 / 0.7);
      }
      .install code { overflow-x: auto; white-space: nowrap; }
      .install code b { color: #9a92ff; font-weight: 500; }
      .install button {
        flex-shrink: 0; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 7px; border: 0; cursor: pointer;
        background: rgb(255 255 255 / 0.08); color: #c9cdda; transition: background 0.15s, color 0.15s;
      }
      .install button:hover { background: rgb(255 255 255 / 0.16); color: #fff; }
      .install button svg { width: 15px; height: 15px; }
      .code {
        margin: 0; width: min(600px, 100%); text-align: left; border-radius: 12px; overflow: hidden;
        background: rgb(22 26 40 / 0.94); border: 1px solid rgb(255 255 255 / 0.06);
        box-shadow: 0 18px 40px -24px rgb(22 26 40 / 0.8);
      }
      .code-bar {
        display: flex; align-items: center; gap: 6px; padding: 9px 12px; border-bottom: 1px solid rgb(255 255 255 / 0.06);
        font-family: var(--mono); font-size: 11px; color: #8a90a6;
      }
      .code-bar i { width: 9px; height: 9px; border-radius: 50%; background: #3a3f52; }
      .code-bar i:nth-child(1) { background: #ff5f57cc; }
      .code-bar i:nth-child(2) { background: #febc2ecc; }
      .code-bar i:nth-child(3) { background: #28c840cc; }
      .code-tabs { display: flex; gap: 2px; margin-left: 8px; min-width: 0; overflow-x: auto; }
      .code-tabs button {
        font: inherit; border: 0; cursor: pointer; white-space: nowrap; padding: 3px 9px; border-radius: 6px;
        background: transparent; color: #8a90a6; transition: background 0.15s, color 0.15s;
      }
      .code-tabs button:hover { color: #d7dae4; }
      .code-tabs button[aria-selected='true'] { background: rgb(255 255 255 / 0.09); color: #fff; }
      .code-tabs button:focus-visible { outline: 2px solid #9a92ff; outline-offset: 1px; }
      .code pre { margin: 0; padding: 14px 16px 16px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.65; color: #d7dae4; }
      .code .k { color: #c792ea; }
      .code .f { color: #82aaff; }
      .code .s { color: #c3e88d; }
      .code .t { color: #f07178; }
      .code .a { color: #ffcb6b; }
      .code .c { color: #6f7790; font-style: italic; }

      /* call to action */
      .cta { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 28px; }
      .btn-lg { padding: 12px 18px; font-size: 14px; border-radius: 10px; }
      .btn-primary {
        background: linear-gradient(135deg, oklch(0.58 0.21 280), oklch(0.5 0.2 272)); border-color: transparent; color: #fff;
        box-shadow: 0 10px 24px -12px oklch(0.5 0.2 277 / 0.9), inset 0 1px 0 rgb(255 255 255 / 0.2);
      }
      .btn-primary:hover { background: linear-gradient(135deg, oklch(0.55 0.21 280), oklch(0.46 0.2 272)); border-color: transparent; }
      .btn-primary svg { transition: transform 0.2s; }
      .btn-primary:hover svg { transform: translateX(3px); }

      /* alternatives: a slow marquee of the editors this one can replace */
      .alt { padding: 72px 0 8px; text-align: center; }
      .alt-label {
        margin: 0 0 22px; padding: 0 16px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em;
        text-transform: uppercase; color: var(--muted);
      }
      .marquee {
        overflow: hidden; padding: 6px 0;
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
        mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
      }
      .marquee-track { display: flex; width: max-content; animation: marquee 48s linear infinite; }
      .marquee:hover .marquee-track { animation-play-state: paused; }
      .marquee-list { display: flex; align-items: center; gap: 14px; margin: 0; padding: 0 7px; list-style: none; }
      @keyframes marquee { to { transform: translateX(-50%); } }
      .rival {
        display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 12px; white-space: nowrap;
        background: rgb(255 255 255 / 0.65); border: 1px solid var(--line); backdrop-filter: blur(8px);
        font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: #7a8091;
        transition: color 0.25s, border-color 0.25s, background 0.25s;
      }
      .rival svg { width: 20px; height: 20px; fill: currentColor; flex-shrink: 0; }
      .rival-mono {
        display: grid; place-items: center; width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0;
        background: currentColor; color: inherit; font-size: 12px; font-weight: 800; line-height: 1;
      }
      .rival-mono { background: #7a8091; color: #fff; }
      .rival:hover { color: var(--ink); border-color: #cfd3dc; background: #fff; }
      .rival:hover .rival-mono { background: var(--ink); }
      .alt-note { margin: 22px auto 0; max-width: 620px; padding: 0 16px; font-size: 14px; line-height: 1.55; color: var(--ink-2); }

      /* three short promises */
      .features { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding-top: 56px; }
      .feature {
        padding: 20px; border-radius: 14px; border: 1px solid var(--line);
        background: rgb(255 255 255 / 0.72); backdrop-filter: blur(10px);
        transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
      }
      .feature:hover { transform: translateY(-2px); border-color: oklch(0.85 0.06 277); box-shadow: 0 18px 36px -24px rgb(40 30 120 / 0.35); }
      .feature-icon {
        display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px;
        background: var(--primary-soft); color: var(--primary);
      }
      .feature-icon svg { width: 18px; height: 18px; }
      .feature h2 { margin: 14px 0 6px; font-size: 15px; font-weight: 650; color: var(--ink); letter-spacing: -0.01em; }
      .feature p { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--muted); }

      /* page 2: the template bank, in a window like the extranet's dialog */
      .brand-row { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
      .brand { text-decoration: none; }
      .crumb { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--muted); }
      .crumb svg { width: 15px; height: 15px; color: #b3b8c4; }
      .bank { padding-top: 20px; }
      /* pages 2 and 3 share one window, under a small control bar */
      .demo-frame { max-width: 1560px; margin: 0 auto; }
      .demo-frame-bar {
        display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px;
        padding: 5px 5px 5px 12px; border-radius: 11px; border: 1px solid var(--line);
        background: rgb(255 255 255 / 0.7); backdrop-filter: blur(8px);
      }
      .demo-frame-steps { display: flex; align-items: center; gap: 6px; margin: 0; padding: 0; list-style: none; min-width: 0; }
      .demo-frame-steps li { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; color: var(--muted); white-space: nowrap; }
      .demo-frame-steps li > svg { width: 14px; height: 14px; color: #b3b8c4; margin-right: 1px; }
      .demo-frame-steps li span {
        display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px;
        font-family: var(--mono); font-size: 11px; font-weight: 600; background: #eef0f4; color: var(--muted);
      }
      .demo-frame-steps li[aria-current] { color: var(--ink); }
      .demo-frame-steps li[aria-current] span { background: var(--primary); color: #fff; box-shadow: 0 3px 8px -3px oklch(0.5 0.2 277 / 0.7); }
      .demo-frame-toggle {
        font: inherit; font-size: 12.5px; font-weight: 500; line-height: 1; display: inline-flex; align-items: center; gap: 7px;
        padding: 7px 11px; border-radius: 8px; cursor: pointer; white-space: nowrap;
        border: 1px solid var(--line); background: #fff; color: var(--ink);
        transition: border-color 0.15s, color 0.15s, background 0.15s;
      }
      .demo-frame-toggle svg { width: 14px; height: 14px; color: var(--primary); }
      .demo-frame-toggle:hover { border-color: oklch(0.8 0.08 277); background: var(--primary-soft); }
      .demo-frame-toggle:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
      .demo-frame.is-expanded {
        position: fixed; inset: 0; z-index: 40; max-width: none; margin: 0; padding: 8px;
        display: flex; flex-direction: column; background: #f6f7fb;
      }
      .demo-frame.is-expanded .demo-frame-bar { margin-bottom: 8px; }
      .demo-frame.is-expanded .window { flex: 1; width: 100%; max-width: none; margin: 0; height: auto; min-height: 0; border-radius: 10px; box-shadow: 0 1px 2px rgb(16 24 40 / 0.05); }
      .window {
        height: calc(100vh - 200px); min-height: 560px; max-width: 1560px; margin: 0 auto; border-radius: 14px; overflow: clip;
        border: 1px solid var(--line); background: #fff;
        box-shadow: 0 1px 2px rgb(16 24 40 / 0.04), 0 30px 60px -30px rgb(40 30 120 / 0.35), 0 0 0 6px rgb(255 255 255 / 0.5);
      }
      .note {
        display: flex; gap: 8px; align-items: flex-start; justify-content: center; margin: 14px auto 0; max-width: 760px;
        font-size: 12.5px; line-height: 1.5; color: var(--muted); text-align: center;
      }
      .note svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 2px; color: var(--primary); }
      .page-templates .footer, .page-editor .footer { padding-top: 28px; }

      /* footer: the author's signature, set like the one on smiro.dev, in the page's violet */
      .footer { margin-top: auto; padding: 56px 0 28px; display: flex; justify-content: center; }
      .made {
        display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
        font-family: var(--mono); font-size: 10px; line-height: 1.5; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
      }
      .made-sig { display: inline-flex; align-items: center; gap: 0.3em; white-space: nowrap; color: var(--ink-2); transition: color 0.3s; }
      .made-mark {
        width: 2em; height: 2em; color: var(--primary);
        fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
        translate: 0.038em -0.153em; padding-bottom: 2px;
        transition: transform 0.4s cubic-bezier(0.2, 0.75, 0.2, 1), filter 0.4s;
      }
      .made:hover .made-sig { color: var(--primary); }
      .made:hover .made-mark { transform: rotate(-8deg) scale(1.08); filter: drop-shadow(0 0 7px oklch(0.55 0.2 277 / 0.45)); }
      @media (prefers-reduced-motion: reduce) {
        .made-mark, .eyebrow i, .hero h1 span, .marquee-track { transition: none; animation: none; }
        .marquee { overflow-x: auto; }
        .made:hover .made-mark { transform: none; }
      }

      @media (max-width: 860px) {
        .features { grid-template-columns: minmax(0, 1fr); }
      }
      @media (max-width: 560px) {
