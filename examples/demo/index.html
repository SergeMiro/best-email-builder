<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Best Email Builder — a drag-and-drop email builder for React that renders in Outlook, Gmail and Apple Mail." />
    <title>Best Email Builder — email builder demo</title>
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #f6f7f9;
        color: #1f2433;
        -webkit-font-smoothing: antialiased;
      }

      /* Landing page only: the builder brings its own styles. Colours follow
         the builder (indigo primary, cool greys) so opening a template does
         not feel like changing sites. */
      .landing {
        --primary: oklch(0.55 0.2 277);
        --primary-hover: oklch(0.5 0.2 277);
        --primary-soft: oklch(0.95 0.03 277);
        --ink: #1f2433;
        --ink-2: #3d4354;
        --muted: #6b7183;
        --line: #e3e6ec;
        --surface: #ffffff;
        --mono: 'Geist Mono', 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
        --signature: #b14f45;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        background:
          radial-gradient(1100px 420px at 50% -120px, oklch(0.92 0.06 277 / 0.75), transparent 70%),
          #f6f7f9;
      }
      .landing *, .landing *::before, .landing *::after { box-sizing: border-box; }
      .landing :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
      .wrap { width: 100%; max-width: 820px; margin: 0 auto; padding: 0 16px; }

      /* top bar */
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 20px; }
      .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; font-size: 14px; color: var(--ink); }
      .brand-mark {
        width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff;
        background: linear-gradient(135deg, oklch(0.6 0.2 277), oklch(0.42 0.15 270));
        box-shadow: 0 4px 12px -4px oklch(0.5 0.2 277 / 0.6);
      }
      .brand-mark svg { width: 17px; height: 17px; }
      .topbar-actions { display: flex; align-items: center; gap: 8px; }
      .segmented { display: inline-flex; padding: 3px; border-radius: 999px; background: #fff; border: 1px solid var(--line); }
      .segmented button {
        font: inherit; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; border: 0; cursor: pointer;
        padding: 4px 11px; border-radius: 999px; background: transparent; color: var(--muted);
        transition: background 0.15s, color 0.15s;
      }
      .segmented button:hover { color: var(--ink); }
      .segmented button[aria-pressed='true'] { background: var(--primary); color: #fff; cursor: default; }

      /* buttons */
      .btn {
        font: inherit; font-size: 13px; font-weight: 500; line-height: 1; display: inline-flex; align-items: center; gap: 7px;
        padding: 9px 14px; border-radius: 8px; cursor: pointer; text-decoration: none; white-space: nowrap;
        border: 1px solid var(--line); background: var(--surface); color: var(--ink);
        transition: background 0.15s, border-color 0.15s, color 0.15s, box-shadow 0.15s;
      }
      .btn svg { width: 15px; height: 15px; flex-shrink: 0; }
      .btn:hover { border-color: #cdd2db; background: #fafbfc; }
      .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 6px 16px -8px oklch(0.5 0.2 277 / 0.8); }
      .btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
      .btn-ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 8px; }
      .btn-ghost:hover { background: #fdecec; border-color: transparent; color: #c2410c; }

      /* hero */
      .hero { padding: 64px 0 36px; text-align: center; }
      .eyebrow {
        display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px;
        background: rgb(255 255 255 / 0.7); border: 1px solid var(--line);
        font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2);
      }
      .eyebrow i { width: 6px; height: 6px; border-radius: 50%; background: #22a06b; box-shadow: 0 0 0 3px rgb(34 160 107 / 0.18); }
      .hero h1 {
        margin: 18px 0 0; font-size: clamp(34px, 6vw, 52px); line-height: 1.05; letter-spacing: -0.03em; font-weight: 750;
        color: var(--ink);
      }
      .hero h1 span {
        background: linear-gradient(120deg, oklch(0.55 0.2 277), oklch(0.6 0.17 235));
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .tagline { margin: 16px auto 0; max-width: 600px; font-size: 17px; line-height: 1.55; color: var(--ink-2); }
      .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 22px; }
      .chip {
        display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 999px;
        background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2);
      }
      .chip svg { width: 14px; height: 14px; color: var(--primary); }
      .install {
        display: inline-flex; align-items: center; gap: 10px; margin-top: 24px; padding: 6px 6px 6px 14px; border-radius: 10px;
        background: #1c2030; color: #e6e8ef; font-family: var(--mono); font-size: 13px; max-width: 100%;
      }
      .install code { overflow-x: auto; white-space: nowrap; }
      .install code b { color: #8f96ff; font-weight: 500; }
      .install button {
        flex-shrink: 0; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 7px; border: 0; cursor: pointer;
        background: rgb(255 255 255 / 0.08); color: #c9cdda; transition: background 0.15s, color 0.15s;
      }
      .install button:hover { background: rgb(255 255 255 / 0.16); color: #fff; }
      .install button svg { width: 15px; height: 15px; }

      /* templates */
      .panel {
        background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
        box-shadow: 0 1px 2px rgb(16 24 40 / 0.04), 0 12px 32px -18px rgb(16 24 40 / 0.18);
      }
      .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
      .panel-head h2 { margin: 0; font-size: 15px; font-weight: 650; display: inline-flex; align-items: center; gap: 8px; }
      .count {
        min-width: 22px; padding: 1px 7px; border-radius: 999px; background: var(--primary-soft); color: var(--primary);
        font-size: 12px; font-weight: 600; text-align: center;
      }
      .note { display: flex; gap: 10px; align-items: flex-start; margin: 0; padding: 12px 18px; background: #fafbfc; border-bottom: 1px solid var(--line); font-size: 12.5px; line-height: 1.5; color: var(--muted); }
      .note svg { width: 15px; height: 15px; flex-shrink: 0; margin-top: 1px; color: var(--primary); }
      .list { list-style: none; margin: 0; padding: 6px; }
      .row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; transition: background 0.15s; }
      .row:hover { background: #f6f7fa; }
      .row + .row { margin-top: 2px; }
      .row-icon { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); flex-shrink: 0; }
      .row-icon svg { width: 17px; height: 17px; }
      .row-text { flex: 1; min-width: 0; }
      .row-name { font-weight: 600; font-size: 14px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row-sub { margin-top: 2px; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .row-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
      .empty { padding: 44px 20px 48px; text-align: center; color: var(--muted); font-size: 14px; }
      .empty-art {
        width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 18px; display: grid; place-items: center;
        background: var(--primary-soft); color: var(--primary);
      }
      .empty-art svg { width: 28px; height: 28px; }
      .empty strong { display: block; color: var(--ink); font-size: 15px; font-weight: 600; }
      .empty p { margin: 6px 0 18px; }

      /* footer: the author's signature, set like the one on smiro.dev */
      .footer { margin-top: auto; padding: 48px 0 28px; display: flex; justify-content: center; }
      .made {
        display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
        font-family: var(--mono); font-size: 10px; line-height: 1.5; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted);
      }
      .made-sig { display: inline-flex; align-items: center; gap: 0.3em; white-space: nowrap; color: var(--ink-2); }
      .made-mark {
        width: 2em; height: 2em; color: var(--signature);
        fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
        translate: 0.038em -0.153em; padding-bottom: 2px;
        transition: transform 0.4s cubic-bezier(0.2, 0.75, 0.2, 1), filter 0.4s;
      }
      .made:hover .made-sig { color: var(--signature); }
      .made:hover .made-mark { transform: rotate(-8deg) scale(1.08); filter: drop-shadow(0 0 7px rgb(177 79 69 / 0.4)); }
      @media (prefers-reduced-motion: reduce) {
        .made-mark { transition: none; }
        .made:hover .made-mark { transform: none; }
      }

      @media (max-width: 560px) {
        .brand-name { display: none; }
        .hero { padding: 44px 0 28px; }
        .tagline { font-size: 15.5px; }
        .panel-head { padding: 14px; }
        .note { padding: 12px 14px; }
        .row { padding: 10px 8px; gap: 10px; }
        .row-icon { display: none; }
        .topbar .btn-label { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
